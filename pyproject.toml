[project]
name = "tractot"
version = "0.1.0"
description = "Mathematical framework based on Optimal Transport to run Statistical models on datas from Tractography."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "coloraide>=5.1",
    "dipy>=1.11.0",
    "fury>=0.12.0",
    "matplotlib>=3.10.6",
    "numpy>=2.3.3",
    "pandas>=2.3.3",
    "pot>=0.9.6.post1",
    "pynrrd>=1.1.3",
    "scipy>=1.16.2",
]
