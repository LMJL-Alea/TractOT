[project]
name = "tractot"
version = "1.0.0"
description = "Mathematical framework based on Optimal Transport to run Statistical models on datas from Tractography."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "coloraide>=8.8.1",
    "dipy>=1.11.0",
    "fury>=0.12.0",
    "matplotlib>=3.10.6",
    "matplotlib-inline>=0.2.2",
    "numpy>=2.3.3",
    "pot>=0.9.6.post1",
    "pynrrd>=1.1.3",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.2",
    "torch>=2.11.0",
    "tractseg>=2.10",
    "vtk>=9.3.1",
]
[tool.setuptools]
py-modules = []
